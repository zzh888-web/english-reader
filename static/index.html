<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="sepia">

<header id="topbar">
  <div class="tb-left">
    <button id="btnOpen" class="btn" title="Open a .txt / .md / .epub book">📖 Open Book</button>
    <input type="file" id="fileInput" accept=".txt,.md,.epub,text/plain" hidden>
    <span id="bookTitle" class="book-title"></span>
  </div>
  <div class="tb-right">
    <button id="btnChapters" class="btn icon" title="Chapters">☰</button>
    <button id="btnFontDown" class="btn icon" title="Smaller text">A−</button>
    <button id="btnFontUp" class="btn icon" title="Larger text">A+</button>
    <button id="btnTheme" class="btn icon" title="Toggle theme">☀</button>
    <button id="btnTrToggle" class="btn icon active" title="Show / hide translations">⇅</button>
    <button id="btnSettings" class="btn icon" title="Settings">⚙</button>
    <button id="btnChatToggle" class="btn icon active" title="Show / hide the reading companion">🗨</button>
  </div>
</header>

<div id="chapterPanel" class="hidden">
  <div class="cp-title">Chapters</div>
  <div id="chapterList"></div>
</div>

<div id="tipbar" class="hidden">
  <span>Tip: select or right-click any sentence to <b>Translate</b> (shown below the sentence) or <b>Explain</b> (shown in the chat panel).</span>
  <button id="tipClose" class="btn tiny" title="Dismiss">✕</button>
</div>

<div id="main">
  <div id="readerWrap">
    <div id="reader"></div>
  </div>
  <div id="divider" title="Drag to resize"></div>
  <aside id="chatPanel">
    <div id="chatHeader">
      <div class="ch-title">Reading Companion<span id="chatModel" class="ch-model"></span></div>
      <div class="ch-actions">
        <button id="btnSearchToggle" class="btn tiny icon-btn" title="Let the assistant search the web">🔍</button>
        <button id="btnChatClear" class="btn tiny" title="Clear conversation">Clear</button>
        <button id="btnChatClose" class="btn tiny" title="Close panel">✕</button>
      </div>
    </div>
    <div id="chatMessages"></div>
    <div id="chatInputWrap">
      <textarea id="chatInput" rows="2" placeholder="Ask about the book… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="btnSend" class="btn primary">Send</button>
    </div>
  </aside>
</div>

<div id="ctxMenu" class="hidden"></div>

<div id="modalBack" class="hidden">
  <div id="settingsModal" role="dialog" aria-modal="true" aria-label="Settings">
    <h2>设置</h2>
    <div class="field">
      <label for="setProvider">提供商预设</label>
      <select id="setProvider"></select>
    </div>
    <div class="field">
      <label for="setBaseUrl">接口地址 <span class="hint">（Base URL，OpenAI 兼容，一般以 /v1 结尾）</span></label>
      <input id="setBaseUrl" placeholder="https://api.openai.com/v1" spellcheck="false">
    </div>
    <div class="field">
      <label for="setApiKey">API 密钥 <span class="hint">（按接口地址自动记忆，切换提供商后自动填回）</span></label>
      <div class="row">
        <input id="setApiKey" type="password" placeholder="sk-…" spellcheck="false" autocomplete="off">
        <button id="btnKeyEye" class="btn small" title="显示/隐藏密钥">👁</button>
      </div>
    </div>
    <div class="field">
      <label for="setModel">模型名称</label>
      <div class="row">
        <input id="setModel" list="modelList" placeholder="gpt-4o-mini" spellcheck="false">
        <datalist id="modelList"></datalist>
        <button id="btnFetchModels" class="btn small">获取模型列表</button>
      </div>
    </div>
    <div class="field">
      <label for="setTemp">温度 <span class="hint">（Temperature，0～2，多数模型建议 0～1；低=稳定贴事实，高=发散有创意）</span> <span id="tempVal" class="hint"></span></label>
      <input id="setTemp" type="range" min="0" max="2" step="0.1">
      <label class="check"><input type="checkbox" id="setTempAuto"> 跟随模型默认（不发送温度参数；Kimi 思考系列等仅支持固定温度的模型请勾选）</label>
    </div>
    <div class="grid2">
      <div class="field">
        <label for="setReplyLang">助手回复语言</label>
        <select id="setReplyLang">
          <option value="Chinese">中文</option>
          <option value="English">English</option>
          <option value="Auto (match the user)">自动（跟随提问语言）</option>
        </select>
      </div>
      <div class="field">
        <label for="setTranslateTo">翻译目标语言</label>
        <select id="setTranslateTo">
          <option value="Chinese">中文</option>
          <option value="Japanese">日语</option>
          <option value="Korean">韩语</option>
          <option value="French">法语</option>
          <option value="German">德语</option>
          <option value="Spanish">西班牙语</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="setTavilyKey">Tavily API 密钥 <span class="hint">（可选 — 🔍 联网搜索用）</span></label>
      <input id="setTavilyKey" type="password" placeholder="tvly-…" spellcheck="false" autocomplete="off">
      <span id="searchHint" class="hint"></span>
    </div>
    <div class="field">
      <label for="setExplainPrompt">解释提示词 <span class="hint">（可选 — 自定义"解释一句话"的方式）</span></label>
      <textarea id="setExplainPrompt" rows="4" spellcheck="false"></textarea>
      <span class="hint">占位符：{TEXT} = 选中的句子，{CONTEXT} = 所在段落。留空使用内置提示词。仅作用于句子解释；单词查词使用独立的内置提示词。</span>
    </div>
    <p class="privacy-note">你的密钥仅保存在本机浏览器的本地存储中，且只通过本地代理发送给你在上面填写的接口地址，不经过任何第三方。</p>
    <div class="modal-actions">
      <button id="btnTest" class="btn ghost">测试连接</button>
      <span class="spacer"></span>
      <button id="btnCancel" class="btn ghost">取消</button>
      <button id="btnSave" class="btn primary">保存</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
